async function runLinkedinFreeSearch(f){
 const payload={project:f.elements.project.value,location:f.elements.location.value.trim(),company:f.elements.company.value.trim(),role:f.elements.role.value.trim(),limit:Number(f.elements.limit.value)};
 linkedQuery=payload; linkedMatches=[];linkedError='';linkedLoading=true;render();
 try{
  const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),45000);
  let response;try{response=await fetch('/api/linkedin-discovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal})}finally{clearTimeout(tm)}
  if(!response.ok){let x=await response.json().catch(()=>({}));throw Error(x.error||`Recherche indisponible (${response.status})`)}
  const x=await response.json(); linkedMatches=Array.isArray(x.results)?x.results:[]; linkedMode='web-index';
  const log={id:uuid(),project:payload.project,terms:'Profils LinkedIn publics'+(payload.role?' · '+payload.role:''),location:payload.location,result:linkedMatches.length,notes:'Découverte web, liens à vérifier manuellement',createdAt:now()};state.searches.unshift(log);event('search','Recherche web LinkedIn',linkedMatches.length+' liens publics trouvés');const added=autoSaveLinkedCandidates(linkedMatches,payload);event('check','Import automatique',added+' nouvelles fiches à vérifier');save();
  if(!linkedMatches.length) linkedError='Aucun profil public indexé trouvé pour ces critères. Essayez une zone plus large ou un autre poste.';
 }catch(e){linkedError=e.name==='AbortError'?'Délai de recherche dépassé. Réessayez.':e.message+' · Pour activer le moteur, lancez le serveur Python local (voir LISEZ-MOI).'}
 finally{linkedLoading=false;render()}
}

 const q=`site:linkedin.com/in/ "${role}" "${x.location||'France'}" ${x.company||''}`;

// Import automatique depuis des résultats publics indexés; aucune donnée non vérifiée n'est inventée.
function autoSaveLinkedCandidates(results,payload){
 let added=0;
 for(const r of results){
  let url=String(r.url||'').trim();
  if(!/^https:\/\/(?:[a-z]{2,3}\.)?linkedin\.com\/in\/[A-Za-z0-9%_.-]+/i.test(url))continue;
  let canonical=url.split('?')[0].replace(/\/$/,'').toLowerCase();
  if(state.leads.some(l=>String(l.linkedin||'').split('?')[0].replace(/\/$/,'').toLowerCase()===canonical))continue;
  const title=String(r.title||'').trim();
  const parts=title.split(/\s+[-–|]\s+/).map(x=>x.trim()).filter(Boolean);
  // Le titre d'un moteur peut ne pas correspondre au profil actuel : ne pas remplir ces champs par conjecture.
  const lead={id:uuid(),company:payload.company||'À confirmer',project:payload.project||'fund',contact:'',role:'',location:payload.location||'',email:'',website:'',linkedin:url,fit:0,capacity:0,access:0,status:'Nouveau',notes:'À vérifier avant contact. Résultat Web : '+title+' | Source : '+url+' | Requête : '+(payload.role||'non précisée'),createdAt:now(),updatedAt:now(),autoImported:true};
  state.leads.unshift(lead);added++;
 }
 if(added){state.demo=state.leads.some(l=>l.demo);save();}
 return added;
}

 leadModal(null);

function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','||c===';'){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(f){const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(reader.result);if(rows.length<2)throw Error('Fichier vide.');const h=rows[0].map(x=>x.trim().toLowerCase());const key=n=>h.indexOf(n);if(key('company')<0)throw Error('Colonne company introuvable. Utilisez le modèle CSV.');let n=0;for(const r of rows.slice(1)){const get=k=>key(k)<0?'':(r[key(k)]||'').trim();if(!get('company'))continue;const pro=get('project').toLowerCase();const l={id:uuid(),company:get('company'),project:pro==='corner'||pro.includes('corner')?'corner':'fund',contact:get('contact'),role:get('role'),location:get('location'),email:get('email'),website:get('website'),linkedin:get('linkedin'),fit:clamp(get('fit'),4),capacity:clamp(get('capacity'),3),access:clamp(get('access'),3),status:STAGES.includes(get('status'))?get('status'):'Nouveau',notes:get('notes'),createdAt:get('createdAt')||now(),updatedAt:now()};if(state.leads.some(x=>x.company.toLowerCase()===l.company.toLowerCase()&&x.email&&l.email&&x.email.toLowerCase()===l.email.toLowerCase()))continue;state.leads.push(l);n++}state.demo=false;event('search','Import CSV',`${n} nouveau(x) prospect(s) importé(s)`);save();render();toast(`${n} prospects importés.`)}catch(e){toast('Import impossible : '+e.message)}};reader.readAsText(f,'UTF-8')}

async function createDraft(){const l=state.leads.find(x=>x.id===emailLeadId);if(!l||!isEmail(l.email)||l.status==='Opposition'){toast('Renseignez un email valide et vérifiez le statut du contact.');return}const subject=document.getElementById('email-subject').value,body=document.getElementById('email-body').value;if(!subject.trim()||!body.trim()){toast('Renseignez un objet et un message.');return}if(isScript()){toast('Création du brouillon Gmail…');try{await gmailDraft(l,subject,body);setStatus(l.id,'Brouillon','Brouillon Gmail créé avec succès');toast('Brouillon Gmail créé. Retrouvez-le dans Gmail > Brouillons.')}catch(e){toast('Erreur Gmail : '+(e.message||String(e)))}}else{const u='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(l.email)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);window.open(u,'_blank','noopener,noreferrer');toast('Gmail ouvert. Ajoutez le PDF manuellement et vérifiez le message.')}}
function setStatus(id,status,msg){let l=state.leads.find(x=>x.id===id);if(!l)return;l.status=status;l.updatedAt=now();event('mail',msg||'Statut mis à jour',l.company,l.id);save();render()}
async function bulkDrafts(){if(!isScript())return toast('Le traitement groupé nécessite Google Apps Script.');let contacts=Array.from(selected).map(id=>state.leads.find(x=>x.id===id)).filter(x=>x&&isEmail(x.email)&&!['Opposition','Sans suite'].includes(x.status));if(!contacts.length)return toast('Aucun contact éligible sélectionné.');if(contacts.length>20){toast('Limite de 20 prospects par lot. Réduisez votre sélection.');return}if(!confirm(`Créer ${contacts.length} brouillon(s) Gmail, sans les envoyer ?`))return;let ok=0,errors=0;for(const l of contacts){try{await gmailDraft(l,tplText(state.templates[l.project].subject,l),tplText(state.templates[l.project].body,l));l.status='Brouillon';l.updatedAt=now();event('mail','Brouillon Gmail créé',l.company,l.id);ok++}catch(e){errors++}}selected.clear();save();render();toast(`${ok} brouillon(s) créés ; ${errors} erreur(s).`)}
function navProject(p){projectFilter=p;selected.clear();render()}
function action(act,id){switch(act){case 'clear-demo':clearDemo();break;case 'add-lead':leadModal(null);break;case 'edit-lead':leadModal(id);break;case 'close-modal':closeModal();break;case 'new-search':searchModal();break;case 'clear-linkedin-results':linkedMatches=[];linkedError='';render();break;case 'manual-linkedin':manualLinkedSearch();break;case 'open-linked':verifyLinkedCandidate(id);break;case 'linked-to-lead':candidateToLead(id);break;case 'clear-selection':selected.clear();render();break;case 'bulk-status':bulkStatusModal();break;case 'delete-lead':if(confirm('Supprimer définitivement cette fiche prospect ?')){state.leads=state.leads.filter(l=>l.id!==id);selected.delete(id);save();closeModal();render();toast('Prospect supprimé.')}break;case 'compose-lead':chooseEmailLead(id);view='emails';render();break;case 'goto-leads':view='leads';render();break;case 'bulk-email':{const ids=Array.from(selected);view='emails';if(ids.length)chooseEmailLead(ids[0]);render();break}case 'create-email':createDraft();break;case 'download-eml':{const l=state.leads.find(x=>x.id===emailLeadId);if(l)createEML(l,document.getElementById('email-subject').value,document.getElementById('email-body').value);break}case 'copy-email':{let text='Objet : '+(document.getElementById('email-subject')?.value||'')+'\n\n'+(document.getElementById('email-body')?.value||'');navigator.clipboard?.writeText(text).then(()=>toast('Email copié.')).catch(()=>toast('Copie non disponible.'));break}case 'bulk-drafts':bulkDrafts();break;case 'export-csv':exportCSV();break;case 'export-json':exportJSON();break;case 'import-csv':pickFile('.csv,text/csv',importCSV);break;case 'import-json':pickFile('.json,application/json',importJSON);break;case 'sample-csv':download('\ufeff'+csvFields.join(',')+'\r\nEntreprise Exemple,fund,Prénom Nom,Responsable RSE,Paris,prenom@example.org,4,2,3,Nouveau,Source à compléter,,,','modele_prospects.csv','text/csv');break;case 'save-settings':{state.org=document.getElementById('org-name').value.trim()||'Mon association';for(let p of ['fund','corner']){state.templates[p].subject=document.getElementById('subject-'+p).value;state.templates[p].body=document.getElementById('body-'+p).value}save();render();toast('Paramètres enregistrés.');break}case 'clear-all':if(confirm('Effacer définitivement tous les prospects, recherches, documents PDF et paramètres locaux ? Une sauvegarde JSON est recommandée.')){clearPDFs();localStorage.removeItem(K);state=seed();state.leads=[];state.searches=[];state.events=[];state.demo=false;save();view='dashboard';render();toast('Données locales effacées.')}break;case 'web-search':{let s=state.searches.find(x=>x.id===id);if(!s)return;window.open('https://www.bing.com/search?q='+encodeURIComponent(s.terms+' '+s.location),'_blank','noopener,noreferrer');break}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-project],[data-act]');if(!el)return;if(el.dataset.page){showPage(el.dataset.page);return}if(el.dataset.project){navProject(el.dataset.project);return}if(el.dataset.act){e.preventDefault();action(el.dataset.act,el.dataset.id)}});
document.addEventListener('input',e=>{if(e.target.id==='lead-query'){query=e.target.value;const pos=e.target.selectionStart;render();let x=document.getElementById('lead-query');x?.focus();x?.setSelectionRange(pos,pos)}if(e.target.classList.contains('score-slider')){const f=e.target.closest('form');for(const k of ['fit','capacity','access']){f.querySelector('#val-'+k).textContent=f.elements[k].value}f.querySelector('#score-total').textContent=['fit','capacity','access'].reduce((sum,k)=>sum+Number(f.elements[k].value),0)+'/10'}if(e.target.id==='email-subject')emailSubject=e.target.value;if(e.target.id==='email-body')emailBody=e.target.value;});
document.addEventListener('change',async e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;render()}else if(e.target.id==='score-filter'){scoreFilter=e.target.value;render()}else if(e.target.id==='select-all'){for(const l of filtered())e.target.checked?selected.add(l.id):selected.delete(l.id);render()}else if(e.target.classList.contains('select-lead')){e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);render()}else if(e.target.id==='email-lead'){chooseEmailLead(e.target.value);render()}else if(e.target.dataset.pdf){const p=e.target.dataset.pdf;let f=e.target.files?.[0];if(f)try{await savePDF(p,f);render();toast('Document '+f.name+' enregistré.')}catch(ex){toast(ex.message)}}});
document.addEventListener('submit',e=>{if(e.target.id==='linkedin-free-form'){e.preventDefault();if(!linkedLoading)runLinkedinFreeSearch(e.target);return}if(e.target.id==='lead-form'){e.preventDefault();const f=e.target;const old=editing?state.leads.find(x=>x.id===editing):null;const l={id:editing||uuid(),company:f.elements.company.value.trim(),project:f.elements.project.value,contact:f.elements.contact.value.trim(),role:f.elements.role.value.trim(),location:f.elements.location.value.trim(),email:f.elements.email.value.trim(),website:f.elements.website.value.trim(),linkedin:f.elements.linkedin.value.trim(),fit:clamp(f.elements.fit.value,4),capacity:clamp(f.elements.capacity.value,3),access:clamp(f.elements.access.value,3),status:f.elements.status.value,notes:f.elements.notes.value,createdAt:old?.createdAt||now(),updatedAt:now()};if(old)Object.assign(old,l);else state.leads.unshift(l);state.demo=state.leads.some(x=>x.demo);event('check',old?'Prospect modifié':'Nouveau prospect ajouté',l.company,l.id);save();closeModal();render();toast('Prospect enregistré.')}else if(e.target.id==='search-form'){e.preventDefault();const f=e.target;let s={id:uuid(),project:f.elements.project.value,terms:f.elements.terms.value.trim(),location:f.elements.location.value.trim(),result:Math.max(0,Number(f.elements.result.value||0)),notes:f.elements.notes.value.trim(),createdAt:now()};state.searches.unshift(s);event('search','Recherche enregistrée',s.terms);save();closeModal();render();toast('Recherche enregistrée.')}else if(e.target.id==='bulk-status-form'){e.preventDefault();const st=e.target.elements.status.value;for(const id of selected){let l=state.leads.find(x=>x.id===id);if(l){l.status=st;l.updatedAt=now();event('check','Statut modifié',l.company+' : '+st,l.id)}}selected.clear();save();closeModal();render();toast('Statuts mis à jour.')}});
render();initPDF();
})();
</script>
